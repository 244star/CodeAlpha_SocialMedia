<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmur</title>
  <meta name="description" content="Murmur is a small social network: post, follow, like and comment.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="#/" aria-label="Murmur home"><span class="brand-mark">m</span><span class="brand-name">Murmur</span></a>
      <div class="nav-links">
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
        <a href="#/explore" data-nav="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Explore</span></a>
        <a href="#/me" data-nav="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
      </div>
      <div class="nav-account" id="nav-account"></div>
    </nav>

    <main id="main" aria-live="polite"></main>

    <aside class="side">
      <div class="search">
        <label class="sr-only" for="search-input">Search people</label>
        <input id="search-input" type="search" placeholder="Search people" autocomplete="off" maxlength="50">
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <section class="card suggestions" id="suggestions" hidden></section>
      <p class="fineprint">Built for the CodeAlpha Full Stack internship.</p>
    </aside>
  </div>

  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/js/app.js"></script>
</body>
</html>
